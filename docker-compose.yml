version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sit_campus_ticketing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password_2026
      POSTGRES_DB: campus_ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_admin -d campus_ticketing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: sit_campus_ticketing_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://campus_admin:campus_secure_password_2026@postgres:5432/campus_ticketing?schema=public
      JWT_SECRET: super-secret-sit-campus-ticketing-token-key-2026-prod
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus_network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sit_campus_ticketing_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - campus_network

networks:
  campus_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
