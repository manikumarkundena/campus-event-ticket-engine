apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ticketing-ingress
  namespace: campus-ticketing
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - campus-events.sit.ac.in
      secretName: campus-events-tls-cert
  rules:
    - host: campus-events.sit.ac.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
